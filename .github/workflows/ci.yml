name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v7
        with: { path: camada-next-example }
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/camada-core
          path: camada-core
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/camada-browser
          path: camada-browser
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/camada-react
          path: camada-react
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/camada-next
          path: camada-next
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm install && npm run build
        working-directory: camada-core
      - run: npm install && npm run build
        working-directory: camada-browser
      - run: npm install && npm run build
        working-directory: camada-react
      - run: npm install && npm run build
        working-directory: camada-next
      - run: npm install
        working-directory: camada-next-example
      - run: npm run build
        working-directory: camada-next-example
